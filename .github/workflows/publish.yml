name: Release VS Code extension

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: vscode-marketplace-publish
  cancel-in-progress: false

jobs:
  release:
    name: Build VSIX and create GitHub Release
    if: github.repository == 'runtz-dev/runtz-vscode-extension'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate tag and source commit
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid extension version: $version"
            exit 1
          fi

          expected_tag="v${version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "::error::Expected tag $expected_tag, received $RELEASE_TAG"
            exit 1
          fi

          tagged_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "$tagged_commit" ]]; then
            echo "::error::Checkout does not match the tagged commit"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "::error::The tagged commit is not part of origin/main"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci

      - name: Check extension
        run: npm run check

      - name: Package exact VSIX
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          vsix="runtz-security-${VERSION}.vsix"
          npm exec -- vsce package --no-dependencies --out "$vsix"
          sha256sum "$vsix" > SHA256SUMS

      - name: Create GitHub Release with VSIX attached
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          vsix="runtz-security-${VERSION}.vsix"

          gh release create "$RELEASE_TAG" \
            "$vsix" \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Runtz Security ${VERSION}" \
            --notes "Manual publish: download \`${vsix}\` from this release and run \`vsce publish --packagePath ${vsix}\` (or upload it at https://marketplace.visualstudio.com/manage)."
